<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pocket CCNA Review" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230d1117'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle'%3E📡%3C/text%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1117'/%3E%3Ctext x='16' y='26' font-size='22' text-anchor='middle'%3E📡%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <title>Pocket CCNA Review</title>
</head>
<body>
<div id="app">

  <!-- ═══ HEADER ══════════════════════════════════════════════ -->
  <header>
    <div>
      <div class="logo">📡 Pocket CCNA Review</div>
      <div class="subtitle">Cisco 200-301</div>
    </div>
    <div class="badge">v1.2.0</div>
  </header>

  <div id="body-area">

    <!-- ═══ SIDE NAV (desktop) ══════════════════════════════════ -->
    <nav id="sidenav">
      <div class="sidenav__section-title">Seções</div>

      <button class="sidenav__link active" id="btn-sidebar-teoria" onclick="showView('teoria')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Teoria
      </button>

      <button class="sidenav__link" id="btn-sidebar-labs" onclick="showView('labs')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
        </svg>
        Laboratórios
      </button>

      <div class="sidenav__footer">
        Pocket CCNA Review<br>
        Cisco 200-301
      </div>
    </nav>

    <!-- ═══ MAIN ═════════════════════════════════════════════════ -->
    <main>

      <!-- ── TEORIA ──────────────────────────────────────────── -->
      <div id="view-teoria" class="view active">
        <div class="content-inner">

          <div class="search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input class="search-input" id="search-teoria" type="search" placeholder="Buscar pílula de teoria…" />
          </div>

          <div class="filter-bar" id="filter-bar">
            <span class="filter-pill active" data-filter="all">Todos</span>
            <span class="filter-pill" data-filter="NET">Net Fundamentals</span>
            <span class="filter-pill" data-filter="ACC">Network Access</span>
            <span class="filter-pill" data-filter="IPC">IP Connectivity</span>
            <span class="filter-pill" data-filter="SVC">IP Services</span>
            <span class="filter-pill" data-filter="SEC">Security</span>
            <span class="filter-pill" data-filter="AUT">Automation</span>
          </div>

          <div id="pills-container"></div>
          <div id="pills-empty" class="empty hidden">Nenhuma pílula encontrada.</div>

        </div>
      </div>

      <!-- ── LABS ────────────────────────────────────────────── -->
      <div id="view-labs" class="view">
        <div class="content-inner">

          <div class="search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input class="search-input" id="search-labs" type="search" placeholder="Buscar laboratório…" />
          </div>

          <div id="labs-container"></div>
          <div id="labs-empty" class="empty hidden">Nenhum laboratório encontrado.</div>

        </div>
      </div>

    </main>
  </div>

  <!-- ═══ BOTTOM NAV (mobile) ══════════════════════════════════ -->
  <nav id="bottom-nav">
    <button class="active" id="btn-teoria" onclick="showView('teoria')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Teoria
    </button>
    <button id="btn-labs" onclick="showView('labs')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
      </svg>
      Labs
    </button>
  </nav>

</div>
<script src="assets/js/data-pills.js"></script>
<script src="assets/js/data-labs.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
