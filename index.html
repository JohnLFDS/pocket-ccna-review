<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ── PWA / TELA CHEIA NO IPHONE ──────────────────────────────────── -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CCNA Review" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Ícone para tela inicial do iPhone -->
  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1117'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle'%3E📡%3C/text%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1117'/%3E%3Ctext x='16' y='26' font-size='22' text-anchor='middle'%3E📡%3C/text%3E%3C/svg%3E" />

  <title>Pocket CCNA Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #21262d;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --yellow:   #d29922;
      --orange:   #f0883e;
      --red:      #f85149;
      --purple:   #bc8cff;
      --cyan:     #39d353;
      --tag-bg:   #1f2937;
      --nav-h:    64px;
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── LAYOUT ─────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100dvh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; }
    header .subtitle { font-size: 11px; color: var(--muted); }
    header .badge {
      margin-left: auto;
      background: var(--accent);
      color: #0d1117;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: .4px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* ── BOTTOM NAV ─────────────────────────────────────── */
    nav {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      height: calc(var(--nav-h) + var(--safe-bot));
      padding-bottom: var(--safe-bot);
      flex-shrink: 0;
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    nav button.active { color: var(--accent); }
    nav button svg { width: 22px; height: 22px; }

    /* ── SECTION VIEWS ──────────────────────────────────── */
    .view { display: none; padding: 12px 12px 20px; }
    .view.active { display: block; }

    /* ── FILTER PILLS ───────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 0 12px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: all .15s;
    }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #0d1117; }

    /* ── CARD ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 14px 12px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-icon {
      width: 30px; height: 30px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .card-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .card-tag {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .card-body { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .card-body ul { padding-left: 16px; }
    .card-body li { margin-bottom: 3px; }
    .card-body b, .card-body strong { color: var(--text); font-weight: 600; }
    .card-body .hl { color: var(--accent); font-weight: 600; }
    .card-body .ok { color: var(--green); font-weight: 600; }
    .card-body .warn { color: var(--yellow); font-weight: 600; }
    .card-body .bad { color: var(--red); font-weight: 600; }

    /* mini table */
    .mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .mini-table th {
      background: var(--surface2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 5px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .mini-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
    .mini-table tr:last-child td { border-bottom: none; }

    /* ── LAB CARD ───────────────────────────────────────── */
    .lab-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .lab-header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .lab-num {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--accent); color: #0d1117;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .lab-title-block { flex: 1; }
    .lab-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .lab-obj { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .lab-chevron { color: var(--muted); transition: transform .2s; font-size: 16px; }
    .lab-card.open .lab-chevron { transform: rotate(180deg); }

    .lab-body { display: none; border-top: 1px solid var(--border); }
    .lab-card.open .lab-body { display: block; }

    .lab-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .lab-section:last-child { border-bottom: none; }
    .lab-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; color: var(--muted); margin-bottom: 8px;
    }
    .lab-steps { list-style: none; padding: 0; }
    .lab-steps li {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 13px; color: var(--text); margin-bottom: 6px;
    }
    .lab-steps li .step-n {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; font-size: 10px; font-weight: 700; color: var(--accent);
      width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }

    /* CLI block */
    .cli-block {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .cli-topbar {
      background: var(--surface2);
      padding: 6px 10px;
      font-size: 10px;
      color: var(--muted);
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .cli-topbar::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .cli-code {
      padding: 12px;
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      font-size: 12px;
      line-height: 1.7;
      overflow-x: auto;
      white-space: pre;
      color: #c9d1d9;
    }
    .cli-code .cmd  { color: #79c0ff; }
    .cli-code .arg  { color: #a5d6ff; }
    .cli-code .val  { color: var(--green); }
    .cli-code .cmt  { color: var(--muted); font-style: italic; }
    .cli-code .mode { color: var(--orange); }
    .cli-code .kw   { color: var(--purple); }

    /* ── SEARCH ─────────────────────────────────────────── */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; }
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px 9px 32px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }

    /* ── EMPTY STATE ─────────────────────────────────────── */
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }

    /* color helpers for tags */
    .tag-net  { background: #1c3a5e; color: #58a6ff; }
    .tag-acc  { background: #1c3a2e; color: #3fb950; }
    .tag-ipc  { background: #3a2a1c; color: #f0883e; }
    .tag-svc  { background: #2e1c3a; color: #bc8cff; }
    .tag-sec  { background: #3a1c1c; color: #f85149; }
    .tag-aut  { background: #1c2e3a; color: #39d353; }

    .icon-net  { background: #1c3a5e; }
    .icon-acc  { background: #1c3a2e; }
    .icon-ipc  { background: #3a2a1c; }
    .icon-svc  { background: #2e1c3a; }
    .icon-sec  { background: #3a1c1c; }
    .icon-aut  { background: #1c2e3a; }

    /* hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="logo">📡 Pocket CCNA</div>
      <div class="subtitle">Review · 200-301</div>
    </div>
    <div class="badge">CCNA 200-301</div>
  </header>

  <main>
    <!-- ══ TEORIA ══════════════════════════════════════════ -->
    <div id="view-teoria" class="view active">

      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search-teoria" type="search" placeholder="Buscar pílula…" />
      </div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-pill active" data-filter="all">Todos</span>
        <span class="filter-pill" data-filter="NET">Net Fundamentals</span>
        <span class="filter-pill" data-filter="ACC">Network Access</span>
        <span class="filter-pill" data-filter="IPC">IP Connectivity</span>
        <span class="filter-pill" data-filter="SVC">IP Services</span>
        <span class="filter-pill" data-filter="SEC">Security</span>
        <span class="filter-pill" data-filter="AUT">Automation</span>
      </div>

      <div id="pills-container"></div>
      <div id="pills-empty" class="empty hidden">Nenhuma pílula encontrada.</div>
    </div>

    <!-- ══ LABS ════════════════════════════════════════════ -->
    <div id="view-labs" class="view">

      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search-labs" type="search" placeholder="Buscar laboratório…" />
      </div>

      <div id="labs-container"></div>
      <div id="labs-empty" class="empty hidden">Nenhum laboratório encontrado.</div>
    </div>
  </main>

  <nav>
    <button class="active" id="btn-teoria" onclick="showView('teoria')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Teoria
    </button>
    <button id="btn-labs" onclick="showView('labs')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
      </svg>
      Laboratórios
    </button>
  </nav>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════

const PILLS = [

  },
  {

/* ═══════════════════════════════════════════════════════════════
   RENDER — PILLS
═══════════════════════════════════════════════════════════════ */
const catMap = {
  NET: { cls: "tag-net icon-net", label: "Net Fund." },
  ACC: { cls: "tag-acc icon-acc", label: "Net Access" },
  IPC: { cls: "tag-ipc icon-ipc", label: "IP Connectivity" },
  SVC: { cls: "tag-svc icon-svc", label: "IP Services" },
  SEC: { cls: "tag-sec icon-sec", label: "Security" },
  AUT: { cls: "tag-aut icon-aut", label: "Automation" }
};

function renderPills(filter, query) {
  const container = document.getElementById('pills-container');
  const empty = document.getElementById('pills-empty');
  const q = (query || '').toLowerCase();
  const filtered = PILLS.filter(p => {
    const matchCat = filter === 'all' || p.cat === filter;
    const matchQ = !q || p.title.toLowerCase().includes(q) || p.html.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  container.innerHTML = filtered.map(p => {
    const m = catMap[p.cat];
    const [iconCls] = m.cls.split(' ');
    const tagCls = m.cls.split(' ')[0];
    return `<div class="card">
      <div class="card-header">
        <div class="card-icon ${iconCls}">${p.icon}</div>
        <div class="card-title">${p.title}</div>
        <span class="card-tag tag-${p.cat.toLowerCase()}">${m.label}</span>
      </div>
      <div class="card-body">${p.html}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════
   RENDER — LABS
═══════════════════════════════════════════════════════════════ */
function renderLabs(query) {
  const container = document.getElementById('labs-container');
  const empty = document.getElementById('labs-empty');
  const q = (query || '').toLowerCase();
  const filtered = LABS.filter(l =>
    !q || l.title.toLowerCase().includes(q) || l.obj.toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  container.innerHTML = filtered.map(l => `
    <div class="lab-card" id="lab-${l.id}">
      <div class="lab-header" onclick="toggleLab(${l.id})">
        <div class="lab-num">${l.id}</div>
        <div class="lab-title-block">
          <div class="lab-title">${l.title}</div>
          <div class="lab-obj">${l.obj}</div>
        </div>
        <span class="lab-chevron">▾</span>
      </div>
      <div class="lab-body">
        ${l.timerNote ? `<div class="lab-section">
          <div class="lab-section-title">⚠ Timers — Pegadinha da Prova</div>
          ${l.timerNote}
        </div>` : ''}
        <div class="lab-section">
          <div class="lab-section-title">Sequência Lógica</div>
          <ul class="lab-steps">
            ${l.steps.map((s, i) => `<li><span class="step-n">${i+1}</span><span>${s}</span></li>`).join('')}
          </ul>
        </div>
        <div class="lab-section">
          <div class="lab-section-title">Comandos Cisco IOS</div>
          <div class="cli-block">
            <div class="cli-topbar">● Cisco IOS Terminal</div>
            <div class="cli-code">${l.cli}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleLab(id) {
  const el = document.getElementById('lab-' + id);
  el.classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════════ */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
}

/* ═══════════════════════════════════════════════════════════════
   FILTERS & SEARCH
═══════════════════════════════════════════════════════════════ */
let currentFilter = 'all';
let currentQuery = '';

document.getElementById('filter-bar').addEventListener('click', e => {
  const pill = e.target.closest('.filter-pill');
  if (!pill) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  currentFilter = pill.dataset.filter;
  renderPills(currentFilter, currentQuery);
});

document.getElementById('search-teoria').addEventListener('input', e => {
  currentQuery = e.target.value;
  renderPills(currentFilter, currentQuery);
});

document.getElementById('search-labs').addEventListener('input', e => {
  renderLabs(e.target.value);
});

/* ═══════════════════════════════════════════════════════════════
   INIT
